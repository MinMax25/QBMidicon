<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>インストール・アンインストール手順</title>
    <link rel="stylesheet" href="content.css">
</head>

<body>
    <div class="container">
        <h1>インストール・アンインストール手順</h1>
        <p>以下の手順でインストールおよびアンインストールを行ってください。</p>
        <ul>
            <li>
                <a href="https://github.com/MinMax25/QBMidicon/releases" target="_blank" rel="noopener noreferrer">
                    https://github.com/MinMax25/QBMidicon/releases
                </a>
            </li>
            <li>
                インストール
                <ol>
                    <li>上記のリンクより最新のリリース版ZIPファイルをダウンロードします</li>
                    <li>ダウンロードした zip を任意の場所に展開します</li>
                    <li>
                        展開されたフォルダ内の QBMidicon.exe を任意の場所へ配置します
                    </li>
                </ol>
            </li>
            <li>
                アンインストール
                <ul>
                    <li>不要になった場合はフォルダごと削除してください（レジストリは使用していません）</li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
