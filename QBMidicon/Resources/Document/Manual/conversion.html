<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>MIDIデータ変換手順</title>
    <link rel="stylesheet" href="content.css">
</head>

<body>
    <div class="container">
        <h1>MIDIデータ変換手順</h1>
        <ol>
            <li>ファイルメニューからOpenを選択し、変換したいMIDIファイルを開きます。</li>
            <li>Converted画面に変換されたトラックの一覧が表示されます。
                <ul>
                    <li>必要に応じて、トランスポーズや歌詞の引き当てトラック指定を行ってください。</li>
                </ul>
            </li>
            <li>ファイルメニューからSaveを選択し、変換結果を保存します。</li>
        </ol>
    </div>
</body>

</html>
