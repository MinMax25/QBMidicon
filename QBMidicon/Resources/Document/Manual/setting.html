<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Setting</title>
    <link rel="stylesheet" href="content.css">
</head>

<body>
    <div class="container">
        <h1>Setting</h1>
        <p>アプリケーションの表示テーマや言語を設定します</p>
        <div class="image-wrapper">
            <img src="image/Setting.png" alt="QBMidiconの画面イメージ" />
        </div>

        <p>画面項目</p>
        <ul>
            <li>Theme：表示テーマ
                <ul>
                    <li>Light / Dark：画面全体の配色を切り替えます</li>
                    <li>Accent Color：アクセントカラーを選択します</li>
                </ul>
            </li>
            <li>Language
                <ul>
                    <li>表示言語を切り替えます</li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
